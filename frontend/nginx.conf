# Servidor del frontend. Todo llega al mismo origen (http://localhost:<puerto>): las páginas las sirve nginx
# y /api, /docs, /redoc y /openapi.json se reenvían a la API por la red interna de compose.
# Así la cookie de sesión (HttpOnly, SameSite=lax) y la CSP connect-src 'self' funcionan sin cambiar el JavaScript.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Límite de subida de CSV de la API: 25 MB, más el resto del formulario
    client_max_body_size 26m;

    # --- API y documentación (las respuestas ya traen sus cabeceras de seguridad desde FastAPI) ---
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # La API cuenta el rate limit con el último valor de X-Forwarded-For (app/limiter.py): nginx agrega
        # al final la IP real del cliente, así que una cabecera inventada por el cliente no sirve para saltarlo
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Publicar un dataset genera su embedding antes de responder
        proxy_read_timeout 120s;
    }

    # --- Páginas y estáticos ---
    location / {
        index index.html;
        try_files $uri $uri/ =404;

        # Mismas cabeceras que agrega el middleware de api/app/main.py a las páginas; si cambian allá, cambiarlas aquí.
        # Van dentro de este location y no a nivel server: ahí nginx también las agregaría a las respuestas de la API,
        # y /docs recibiría dos CSP (la suya y esta, que bloquea el script de Swagger) y se quedaría en blanco
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.5.1/; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;
    }
}
